[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-channel-manager"
version = "0.4.0"
description = "Administrador multiempresa de canales de Telegram"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.25,<4",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "pydantic-settings>=2.10,<3",
  "redis>=6,<7",
  "sqlalchemy[asyncio]>=2.0.41,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/channel_manager_bot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
